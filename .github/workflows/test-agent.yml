name: Automatic unit test agent

# Phase A source only: this workflow becomes live only after approved installation on main.
on:
  workflow_run:
    workflows: [Ordinary CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      ordinary_ci_run_id:
        description: Exact completed Ordinary CI pull_request run to reprocess
        required: true
        type: string

permissions: {}

env:
  TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
  TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}

jobs:
  prepare:
    if: ${{ github.repository == 'kreshby/cloudfide-test-agent' && !github.event.repository.private && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
      repository_id: ${{ steps.prepare.outputs.repository_id }}
      pr_number: ${{ steps.prepare.outputs.pr_number }}
      source_run_id: ${{ steps.prepare.outputs.source_run_id }}
      handoff_sha256: ${{ steps.prepare.outputs.handoff_sha256 }}
      artifact_id: ${{ steps.receipt.outputs.artifact_id }}
    steps:
      - name: Check out exact trusted workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted
      - name: Validate source and prepare bounded evidence
        id: prepare
        working-directory: trusted
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m automation.test_agent.workflow prepare
      - name: Upload final allowlisted T06 artifact
        id: final
        if: ${{ steps.prepare.outputs.artifact == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-agent-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/t07-evidence/final/manifest.json
            ${{ runner.temp }}/t07-evidence/final/verification.json
            ${{ runner.temp }}/t07-evidence/final/report-metadata.json
            ${{ runner.temp }}/t07-evidence/final/generated-tests.patch
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
      - name: Record only the trusted successful patch upload receipt
        id: receipt
        if: ${{ !cancelled() && steps.prepare.outputs.publish == 'true' }}
        env:
          UPLOAD_OUTCOME: ${{ steps.final.outcome }}
          UPLOAD_ARTIFACT_ID: ${{ steps.final.outputs.artifact-id }}
          PATCH_PREPARED: ${{ steps.prepare.outputs.patch }}
        run: |
          python3 - <<'PY'
          import os, re
          value = ''
          if os.environ['UPLOAD_OUTCOME'] == 'success' and os.environ['PATCH_PREPARED'] == 'true':
              value = os.environ['UPLOAD_ARTIFACT_ID']
              if re.fullmatch(r'[1-9][0-9]{0,18}', value) is None or int(value) > 2**63 - 1:
                  raise SystemExit('Invalid trusted artifact receipt')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('artifact_id=' + value + '\n')
          PY
      - name: Upload one bounded current-run handoff
        if: ${{ !cancelled() && steps.prepare.outputs.publish == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-agent-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/t07-evidence/handoff.json
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

  publisher:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.publish == 'true' && github.repository == 'kreshby/cloudfide-test-agent' && !github.event.repository.private && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    concurrency:
      group: test-agent-publisher-${{ needs.prepare.outputs.repository_id }}-${{ needs.prepare.outputs.pr_number }}
      cancel-in-progress: false
    steps:
      - name: Check out exact trusted publisher commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted
      - name: Download only this agent run's handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-agent-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/t07-handoff
      - name: Validate handoff, publish sticky report and enforce actual outcome
        working-directory: trusted
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_CI_RUN_ID: ${{ needs.prepare.outputs.source_run_id }}
          EXPECTED_PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          HANDOFF_SHA256: ${{ needs.prepare.outputs.handoff_sha256 }}
          FINAL_ARTIFACT_ID: ${{ needs.prepare.outputs.artifact_id }}
        run: python3 -m automation.test_agent.workflow publish
